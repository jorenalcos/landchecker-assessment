---
openapi: 3.0.1
info:
  title: LandChecker API
  version: v1
  description: REST API documentation for LandChecker.
servers:
- url: http://localhost:3000
  description: Local development server
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter your JWT token.
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        created_at:
          type: string
          format: date-time
      required:
      - id
      - email
      - created_at
    RegistrationRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
      required:
      - email
      - password
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
      - email
      - password
    AuthenticationResponse:
      type: object
      properties:
        message:
          type: string
        user:
          "$ref": "#/components/schemas/User"
        token:
          type: string
      required:
      - message
      - user
      - token
    CurrentUserResponse:
      type: object
      properties:
        user:
          "$ref": "#/components/schemas/User"
      required:
      - user
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
      - error
    ValidationErrorResponse:
      type: object
      properties:
        errors:
          type: array
          items:
            type: string
      required:
      - errors
security: []
paths:
  "/api/v1/auth/register":
    post:
      summary: Register a new user
      tags:
      - Authentication
      parameters: []
      responses:
        '201':
          description: Registration successful
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthenticationResponse"
        '422':
          description: Duplicate email address
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ValidationErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/RegistrationRequest"
  "/api/v1/auth/login":
    post:
      summary: Login user
      tags:
      - Authentication
      parameters: []
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthenticationResponse"
        '401':
          description: Unknown email
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/LoginRequest"
  "/api/v1/auth/me":
    get:
      summary: Get authenticated user
      tags:
      - Authentication
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Authenticated user returned
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CurrentUserResponse"
        '401':
          description: Invalid authentication token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/api/v1/properties":
    get:
      summary: List all properties
      tags:
      - Properties
      responses:
        '200':
          description: Properties retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  properties:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        title:
                          type: string
                        description:
                          type: string
                          nullable: true
                        price:
                          type: string
                          example: '2500000.00'
                        bedrooms:
                          type: integer
                        bathrooms:
                          type: integer
                          nullable: true
                        property_type:
                          type: string
                        address:
                          type: string
                        status:
                          type: string
                        created_at:
                          type: string
                          format: date-time
                        updated_at:
                          type: string
                          format: date-time
    post:
      summary: Create a property
      tags:
      - Properties
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '201':
          description: Property created successfully
        '422':
          description: Property validation failed
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                price:
                  type: number
                  minimum: 0.01
                bedrooms:
                  type: integer
                  minimum: 0
                bathrooms:
                  type: integer
                  nullable: true
                property_type:
                  type: string
                address:
                  type: string
                status:
                  type: string
              required:
              - title
              - price
              - bedrooms
              - property_type
              - address
        required: true
  "/api/v1/properties/{id}":
    parameters:
    - name: id
      in: path
      description: Property ID
      required: true
      schema:
        type: integer
    get:
      summary: Retrieve a property
      tags:
      - Properties
      responses:
        '200':
          description: Property retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  property:
                    type: object
                    properties:
                      id:
                        type: integer
                      title:
                        type: string
                      description:
                        type: string
                        nullable: true
                      price:
                        type: string
                        example: '2500000.00'
                      bedrooms:
                        type: integer
                      bathrooms:
                        type: integer
                        nullable: true
                      property_type:
                        type: string
                      address:
                        type: string
                      status:
                        type: string
                      created_at:
                        type: string
                        format: date-time
                      updated_at:
                        type: string
                        format: date-time
        '404':
          description: Property not found
    patch:
      summary: Update a property
      tags:
      - Properties
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '200':
          description: Property updated successfully
        '422':
          description: Property validation failed
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                price:
                  type: number
                  minimum: 0.01
                bedrooms:
                  type: integer
                  minimum: 0
                bathrooms:
                  type: integer
                  nullable: true
                property_type:
                  type: string
                address:
                  type: string
                status:
                  type: string
        required: true
    delete:
      summary: Delete a property
      tags:
      - Properties
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Property deleted successfully
